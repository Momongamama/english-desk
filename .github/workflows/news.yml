name: Daily news

on:
  schedule:
    - cron: "30 21 * * *"   # 05:30 Taiwan time, before the morning practice
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch-news.mjs, .github/workflows/news.yml]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs news.json
      - name: Commit news.json if it changed
        run: |
          git add news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily news"
          git push
