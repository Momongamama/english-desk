name: Daily news

on:
  # GitHub delays or drops scheduled runs when it is busy (11-05's 05:30 run never started), so there are backup
  # times; a backup run does nothing if the news was already fetched in the last 6 hours. Minutes avoid :00.
  schedule:
    - cron: "30 21 * * *"   # 05:30 Taiwan time, before the morning practice
    - cron: "17 22 * * *"   # 06:17 backup
    - cron: "43 23 * * *"   # 07:43 backup
    - cron: "11 1 * * *"    # 09:11 backup
    # Podcasts only. The Indicator posts at 08:00 UTC (16:00 Taiwan) and Business Daily at 21:30 UTC, so a list
    # fetched only at 05:30 was missing the newest episode most of the day. These runs never touch news.json.
    - cron: "37 8 * * *"    # 16:37 Taiwan, after The Indicator
    - cron: "23 13 * * *"   # 21:23 Taiwan, backup
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch-news.mjs, scripts/fetch-podcasts.mjs, .github/workflows/news.yml]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip the news on a backup run if it is already fresh
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in "37 8 * * *"|"23 13 * * *") echo "podcast-only run"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          age=$(( $(date +%s) - $(date -d "$(node -p 'require("./news.json").updated' 2>/dev/null || echo 1970-01-01)" +%s) ))
          echo "news.json is $((age / 60)) minutes old"
          if [ "$age" -lt 21600 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs news.json
        if: steps.fresh.outputs.skip != 'true'
      # Shadowing podcasts: episode list only, fetched on every run (it is cheap, and a fresh news.json says nothing
      # about the podcasts). A failure here must not block the news.
      - run: node scripts/fetch-podcasts.mjs podcasts.json
        continue-on-error: true
      - name: Commit news.json and podcasts.json if they changed
        run: |
          git add news.json podcasts.json 2>/dev/null || git add news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily news"
          git pull --rebase -q origin main && git push   # another workflow (cache versions) may have pushed first
